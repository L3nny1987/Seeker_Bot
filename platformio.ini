; ============================================================================
;  Seeker_Bot - Autonomer Kettenroboter
;  MCU      : ESP32 (esp32dev / WROOM-32)
;  Framework: ESP-IDF (Version siehe dependencies.lock)
;  Antrieb  : L298N Dual-H-Bridge (Kanal A = Fahrt, Kanal B = Drehung)
;  Sensorik : FHL-LD20 LiDAR (UART)
; ============================================================================

[platformio]
name = Seeker_Bot
description = Autonomer Panzerketten-Roboter mit FHL-LD20 LiDAR auf ESP32 (ESP-IDF)
default_envs = seeker_bot

; ---------------------------------------------------------------------------
;  Gemeinsame Basis-Konfiguration
; ---------------------------------------------------------------------------
[common]
platform = espressif32@7.1.3
board = esp32dev
framework = espidf
extra_scripts =
    pre:tools/dashboard_build.py
    post:tools/export_ota.py
; Zwei OTA-Slots; jede gebaute Firmware landet zusaetzlich in ota/
board_build.partitions = partitions_ota.csv
board_build.flash_size = 4MB

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
; Verhindert, dass der Monitor den ESP32 beim Verbinden resettet
monitor_rts = 0
monitor_dtr = 0

upload_speed = 921600

build_flags =
    -DSEEKER_BOT_VERSION=\"0.4.0\"
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
;  Haupt-Environment
; ---------------------------------------------------------------------------
[env:seeker_bot]
extends = common

; ---------------------------------------------------------------------------
;  Debug-Environment: zusaetzliches Logging
; ---------------------------------------------------------------------------
[env:seeker_bot_debug]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -DSEEKER_DEBUG=1
