name: Firmware and host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hardware-free regression suite
        run: python tools/run_host_tests.py
      - name: Publication boundary and documentation links
        run: python tools/check_publication.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Create disposable build credentials
        run: cp src/credentials.example.h src/credentials.h
      - name: Build ESP32 firmware
        run: pio run -e seeker_bot
